name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The app targets Windows (process-tree handling, paths); test on the same OS.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # better-sqlite3 13 always compiles from source; the node-gyp bundled with
      # npm 10.9 cannot detect the runner's Visual Studio 2026, so use a current one.
      - name: Use current node-gyp
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
